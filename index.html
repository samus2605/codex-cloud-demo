<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex Cloud Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 40px;
      background: #f6f8fa;
      color: #222;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Codex Cloud Demo</h1>
  <p id="message">这是第一个版本。</p>
  <button onclick="changeText()">点我</button>

  <script>
    function changeText() {
      document.getElementById("message").textContent = "按钮已点击。";
    }
  </script>
</body>
</html>
